<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <title>Pixel Plumber — Mobile Platformer</title>
    <style>
      :root {
        --dpad-size: 168px;
        --dpad-arm: 56px;
        --ab-size: 70px;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        position: fixed;
        inset: 0;
      }

      #app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      #game-root {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        position: relative;
      }

      canvas#stage {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #5C94FC;
        touch-action: none;
      }

      #controls {
        flex: 0 0 auto;
        height: 230px;
        background: linear-gradient(#1c1c1c, #0c0c0c);
        border-top: 2px solid #2a2a2a;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        box-sizing: border-box;
      }

      @media (max-height: 640px) {
        #controls { height: 190px; }
        :root { --dpad-size: 140px; --dpad-arm: 46px; --ab-size: 60px; }
      }
      @media (orientation: landscape) {
        #controls {
          height: auto;
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          background: transparent;
          border-top: none;
          padding: 18px 28px;
          pointer-events: none;
        }
        #controls > * { pointer-events: auto; }
      }

      /* D-pad */
      #dpad {
        position: relative;
        width: var(--dpad-size);
        height: var(--dpad-size);
        touch-action: none;
      }
      .dpad-btn {
        position: absolute;
        width: var(--dpad-arm);
        height: var(--dpad-arm);
        background: #2b2b2b;
        border: 2px solid #555;
        color: #d0d0d0;
        font-size: 22px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        margin: 0;
        touch-action: none;
        box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.5);
      }
      .dpad-btn.pressed {
        background: #444;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
      }
      .dpad-up    { top: 0; left: 50%; transform: translateX(-50%); border-radius: 8px 8px 0 0; border-bottom: none; }
      .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 0 0 8px 8px; border-top: none; }
      .dpad-left  { left: 0; top: 50%; transform: translateY(-50%); border-radius: 8px 0 0 8px; border-right: none; }
      .dpad-right { right: 0; top: 50%; transform: translateY(-50%); border-radius: 0 8px 8px 0; border-left: none; }
      .dpad-center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: var(--dpad-arm);
        height: var(--dpad-arm);
        transform: translate(-50%, -50%);
        background: #2b2b2b;
        pointer-events: none;
      }

      /* A / B buttons */
      #ab-buttons {
        position: relative;
        width: calc(var(--ab-size) * 2.3);
        height: calc(var(--ab-size) * 1.8);
      }
      .ab-btn {
        position: absolute;
        width: var(--ab-size);
        height: var(--ab-size);
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,0.25);
        color: #fff;
        font-size: 22px;
        font-weight: 800;
        font-family: "Courier New", monospace;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
        padding: 0;
        margin: 0;
        touch-action: none;
        box-shadow: 0 5px 0 rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.25);
      }
      .ab-btn.pressed {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(0,0,0,0.45), inset 0 -2px 0 rgba(0,0,0,0.25);
      }
      #btn-a {
        right: 0;
        bottom: 14px;
        background: radial-gradient(circle at 35% 30%, #ff8268, #c22a2a);
      }
      #btn-b {
        left: 0;
        top: 14px;
        background: radial-gradient(circle at 35% 30%, #ffdf52, #c08a14);
        color: #2a1208;
      }

      /* HUD */
      #hud {
        position: absolute;
        top: env(safe-area-inset-top, 8px);
        left: 0;
        right: 0;
        padding: 6px 10px;
        display: flex;
        justify-content: space-between;
        font-family: "Courier New", monospace;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
        z-index: 10;
      }
      #hud .group { display: flex; gap: 10px; }

      /* Overlay */
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.82);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        z-index: 30;
        font-family: "Courier New", monospace;
      }
      #overlay h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 2px;
        color: #FFD23F;
        text-shadow: 3px 3px 0 #000;
      }
      #overlay p { margin: 0; max-width: 320px; line-height: 1.5; font-size: 14px; }
      #overlay button {
        margin-top: 10px;
        padding: 14px 32px;
        font-family: inherit;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 2px;
        background: #FFD23F;
        color: #1a1208;
        border: none;
        border-radius: 6px;
        box-shadow: 0 4px 0 #b88c1d;
        cursor: pointer;
        touch-action: manipulation;
      }
      #overlay.hidden { display: none; }
    </style>
</head>
  <body>
    <div id="app">
      <div id="game-root">
        <canvas id="stage"></canvas>
        <div id="hud">
          <div class="group">
            <span id="hud-score">SCORE 000000</span>
            <span id="hud-coins">x00</span>
          </div>
          <div class="group">
            <span id="hud-lives">LIVES 3</span>
            <span id="hud-time">TIME 300</span>
          </div>
        </div>
      </div>
      <div id="controls">
        <div id="dpad">
          <button class="dpad-btn dpad-up"    data-dir="up"    aria-label="Up">▲</button>
          <button class="dpad-btn dpad-left"  data-dir="left"  aria-label="Left">◀</button>
          <div class="dpad-center"></div>
          <button class="dpad-btn dpad-right" data-dir="right" aria-label="Right">▶</button>
          <button class="dpad-btn dpad-down"  data-dir="down"  aria-label="Down">▼</button>
        </div>
        <div id="ab-buttons">
          <button id="btn-b" class="ab-btn" aria-label="B — run / fire">B</button>
          <button id="btn-a" class="ab-btn" aria-label="A — jump">A</button>
        </div>
      </div>
    </div>

    <div id="overlay">
      <h1 id="overlay-title">PIXEL PLUMBER</h1>
      <p id="overlay-body">D-pad to walk · A to jump · B to run (and throw fireballs when powered up) · Down to crouch.</p>
      <button id="overlay-btn" type="button">START</button>
    </div>
