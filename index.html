<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#5C94FC" />
    <title>Pixel Plumber — Mobile Platformer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      canvas#stage {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #5C94FC;
        touch-action: none;
      }
      #hud {
        position: fixed;
        top: env(safe-area-inset-top, 8px);
        left: 0;
        right: 0;
        padding: 8px 14px;
        display: flex;
        justify-content: space-between;
        font-family: "Courier New", monospace;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 2px 2px 0 #000;
        pointer-events: none;
        z-index: 10;
      }
      #hud .group { display: flex; gap: 14px; }
      #action-btn {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ff7a4a, #c0392b);
        border: 3px solid rgba(255,255,255,0.4);
        box-shadow: 0 6px 0 rgba(0,0,0,0.35), inset 0 -4px 0 rgba(0,0,0,0.25);
        color: #fff;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 1px;
        text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        touch-action: none;
      }
      #action-btn.pressed {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(0,0,0,0.35), inset 0 -2px 0 rgba(0,0,0,0.25);
      }
      #overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.78);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-align: center;
        padding: 24px;
        z-index: 30;
        font-family: "Courier New", monospace;
      }
      #overlay h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 2px;
        color: #FFD23F;
        text-shadow: 3px 3px 0 #000;
      }
      #overlay p { margin: 0; max-width: 320px; line-height: 1.5; font-size: 14px; }
      #overlay button {
        margin-top: 10px;
        padding: 12px 28px;
        font-family: inherit;
        font-weight: 700;
        font-size: 16px;
        letter-spacing: 2px;
        background: #FFD23F;
        color: #1a1208;
        border: none;
        border-radius: 6px;
        box-shadow: 0 4px 0 #b88c1d;
        cursor: pointer;
        touch-action: manipulation;
      }
      #overlay.hidden { display: none; }
      #control-hint {
        position: fixed;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 14px;
        font-family: "Courier New", monospace;
        font-size: 11px;
        color: rgba(255,255,255,0.65);
        text-shadow: 1px 1px 0 #000;
        pointer-events: none;
        z-index: 10;
        max-width: 60vw;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="game-root">
      <canvas id="stage"></canvas>
    </div>
    <div id="hud">
      <div class="group">
        <span id="hud-score">SCORE 000000</span>
        <span id="hud-coins">x00</span>
      </div>
      <div class="group">
        <span id="hud-lives">LIVES 3</span>
        <span id="hud-time">TIME 300</span>
      </div>
    </div>
    <div id="control-hint">drag = walk · tap or swipe up = jump · hold bottom = crouch</div>
    <button id="action-btn" type="button" aria-label="Run / Fire">RUN<br/>FIRE</button>
    <div id="overlay">
      <h1 id="overlay-title">PIXEL PLUMBER</h1>
      <p id="overlay-body">A mobile platformer. Drag to walk, swipe up to jump, hold the button to run (and throw fireballs once powered up). Reach the flagpole.</p>
      <button id="overlay-btn" type="button">START</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
